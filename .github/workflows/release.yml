name: Release Build and Publish

on:
  release:
    types: [published]

concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-rpm-container.yml
    secrets: inherit
    with:
      alma_version: 9
      push_image: true
      run_registry_login: true
      image_tags: |
        ghcr.io/${{ github.repository_owner }}/epics-alma9:${{ github.event.release.tag_name }}
      upload_rpm_artifact: false
      upload_srpm_artifact: true
      upload_release_assets: true
      release_tag: ${{ github.event.release.tag_name }}
